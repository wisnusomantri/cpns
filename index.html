<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Latihan Soal CPNS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #f4f6fb;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }

  /* Layar loading + tombol buka manual, tampil sampai iframe terbukti berhasil */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: #fff;
    z-index: 2;
    transition: opacity .35s ease;
    padding: 24px;
    text-align: center;
  }
  #loading .spinner {
    width: 40px; height: 40px;
    border: 4px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: putar 0.8s linear infinite;
    margin-bottom: 16px;
  }
  #loading p.status { font-size: 14px; opacity: .9; margin: 0 0 22px; }
  @keyframes putar { to { transform: rotate(360deg); } }

  .btn-buka {
    display: inline-block;
    padding: 12px 26px;
    background: #fff;
    color: #0d47a1;
    text-decoration: none;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 700;
    box-shadow: 0 2px 8px rgba(0,0,0,.15);
  }
  .catatan-kecil {
    margin-top: 14px;
    font-size: 12px;
    opacity: .75;
    max-width: 320px;
  }

  #appFrame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1;
  }
</style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p class="status" id="statusText">Memuat Latihan Soal CPNS...</p>
    <a id="fallbackLink" class="btn-buka" href="#" target="_top">Buka Aplikasi</a>
    <p class="catatan-kecil">Kalau tampilan tidak muncul otomatis dalam beberapa detik, ini biasa terjadi karena Google membatasi Web App-nya dibuka di dalam iframe — klik tombol di atas untuk membukanya langsung.</p>
  </div>

  <!--
    ======================================================================
    GANTI URL DI BAWAH INI dengan URL Web App hasil Deploy Apps Script Anda.
    Cara ambil URL: di editor Apps Script -> Deploy -> Manage deployments
    (atau New deployment) -> salin URL yang diakhiri "/exec".

    PENTING soal iframe: Apps Script Web App kadang TIDAK BISA di-iframe
    walau URL aslinya normal dibuka langsung. Penyebab paling umum:
      1) Deploy diset "Who has access" selain "Anyone" -> Google me-redirect
         ke halaman login accounts.google.com, dan halaman itu memblokir
         dirinya sendiri dari iframe (X-Frame-Options: deny).
      2) Browser memblokir cookie pihak ketiga (third-party cookies), yang
         kadang dibutuhkan Apps Script untuk sesi meski akses "Anyone".
    Kalau setelah cek Deploy > Manage deployments > "Who has access: Anyone"
    iframe tetap gagal, itu keterbatasan dari sisi Google, bukan file ini.
    Karena itu tombol "Buka Aplikasi" di atas selalu ditampilkan sebagai
    jalur pasti berhasil, tidak menunggu iframe gagal dulu.
    ======================================================================
  -->
  <script>
    // Dibungkus window.addEventListener('load', ...) supaya SEMUA elemen HTML
    // (termasuk <iframe> di bawah) sudah pasti terbentuk dulu sebelum diakses -
    // ini yang tadi menyebabkan error "Cannot set properties of null".
    window.addEventListener('load', function () {
      const URL_WEB_APP = "https://script.google.com/a/macros/guru.smk.belajar.id/s/AKfycbxD6y-alJBbQsSTarluLBymESqLzIDJ7_A0vi1JEYfHj00Eryrvy_Vj48xVXPKrlGpmeA/exec"; // contoh: https://script.google.com/macros/s/XXXXXXXXXXXXXXXX/exec

      const frame = document.getElementById('appFrame');
      const loading = document.getElementById('loading');
      const statusText = document.getElementById('statusText');
      const fallbackLink = document.getElementById('fallbackLink');
      fallbackLink.href = URL_WEB_APP;

      if (!URL_WEB_APP || URL_WEB_APP.indexOf('GANTI_DENGAN_URL') !== -1) {
        statusText.textContent = '⚙️ Belum dikonfigurasi';
        document.querySelector('.catatan-kecil').textContent =
          'Buka file index.html ini dan ganti URL_WEB_APP dengan URL deploy Apps Script Anda.';
        fallbackLink.style.display = 'none';
      } else {
        frame.src = URL_WEB_APP;
        frame.onload = () => {
          // Iframe berhasil dimuat -> sembunyikan layar loading & tombol manual
          loading.style.opacity = '0';
          setTimeout(() => loading.style.display = 'none', 350);
        };
      }
    });
  </script>

  <iframe id="appFrame" title="Latihan Soal CPNS" allow="clipboard-write"></iframe>

</body>
</html>
