<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Latihan Soal CPNS</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    overflow: hidden;
    background: #f4f6fb;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }

  /* Layar loading yang tampil sebelum iframe selesai dimuat */
  #loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1a73e8, #0d47a1);
    color: #fff;
    z-index: 2;
    transition: opacity .35s ease;
  }
  #loading .spinner {
    width: 42px; height: 42px;
    border: 4px solid rgba(255,255,255,.35);
    border-top-color: #fff;
    border-radius: 50%;
    animation: putar 0.8s linear infinite;
    margin-bottom: 14px;
  }
  #loading p { font-size: 14px; opacity: .9; margin: 0; }
  @keyframes putar { to { transform: rotate(360deg); } }

  #appFrame {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    border: none;
    z-index: 1;
  }

  #errorBox {
    position: fixed;
    inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
    background: #f4f6fb;
    color: #1f2430;
    z-index: 3;
  }
  #errorBox h2 { margin: 0 0 8px; font-size: 18px; }
  #errorBox p { margin: 0; font-size: 14px; color: #5f6368; max-width: 380px; }
  #errorBox a {
    margin-top: 16px; display: inline-block; padding: 10px 20px;
    background: #1a73e8; color: #fff; text-decoration: none;
    border-radius: 10px; font-size: 14px; font-weight: 600;
  }
</style>
</head>
<body>

  <div id="loading">
    <div class="spinner"></div>
    <p>Memuat Latihan Soal CPNS...</p>
  </div>

  <div id="errorBox">
    <h2>⚠️ Sistem tidak bisa dimuat</h2>
    <p>Kemungkinan link Web App Apps Script belum di-deploy ulang, akses "Anyone"
       belum diaktifkan, atau ada masalah koneksi. Coba buka langsung lewat tombol di bawah.</p>
    <a id="fallbackLink" href="#" target="_blank" rel="noopener">Buka di Tab Baru</a>
  </div>

  <!--
    ======================================================================
    GANTI URL DI BAWAH INI dengan URL Web App hasil Deploy Apps Script Anda.
    Cara ambil URL: di editor Apps Script -> Deploy -> Manage deployments
    (atau New deployment) -> salin URL yang diakhiri "/exec".
    ======================================================================
  -->
  <script>
    const URL_WEB_APP = "https://script.google.com/a/macros/guru.smk.belajar.id/s/AKfycbyDD80L1XM26ZAo9KkJ1YK9uNTnlhk2Pclz11DCytpIucSeQaLd0NL1UGr0CzNnOKWcHQ/exec"; // contoh: https://script.google.com/macros/s/XXXXXXXXXXXXXXXX/exec

    const frame = document.getElementById('appFrame');
    const loading = document.getElementById('loading');
    const errorBox = document.getElementById('errorBox');
    document.getElementById('fallbackLink').href = URL_WEB_APP;

    let sudahDimuat = false;
    const batasWaktu = setTimeout(() => {
      if (!sudahDimuat) {
        loading.style.display = 'none';
        errorBox.style.display = 'flex';
      }
    }, 15000); // 15 detik timeout

    if (!URL_WEB_APP || URL_WEB_APP.indexOf('GANTI_DENGAN_URL') !== -1) {
      clearTimeout(batasWaktu);
      loading.style.display = 'none';
      errorBox.style.display = 'flex';
      document.querySelector('#errorBox h2').textContent = '⚙️ Belum dikonfigurasi';
      document.querySelector('#errorBox p').textContent = 'Buka file index.html ini dan ganti URL_WEB_APP dengan URL deploy Apps Script Anda.';
      document.getElementById('fallbackLink').style.display = 'none';
    } else {
      frame.src = URL_WEB_APP;
      frame.onload = () => {
        sudahDimuat = true;
        clearTimeout(batasWaktu);
        loading.style.opacity = '0';
        setTimeout(() => loading.style.display = 'none', 350);
      };
    }
  </script>

  <iframe id="appFrame" title="Latihan Soal CPNS" allow="clipboard-write"></iframe>

</body>
</html>
